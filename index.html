<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Overcharge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a18;font-family:system-ui,-apple-system,sans-serif}
#root{width:100%;height:100%;position:relative}
canvas{display:block}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#menu{position:absolute;inset:0;z-index:30;pointer-events:auto;background:radial-gradient(ellipse at 50% 0%,#1a1040 0%,transparent 45%),radial-gradient(ellipse at 20% 80%,#0a2a4a 0%,transparent 40%),radial-gradient(ellipse at 80% 70%,#2a1040 0%,transparent 35%),linear-gradient(180deg,#0c0c22 0%,#060614 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));transition:opacity .35s,visibility .35s;overflow:hidden}
#menu.hide{opacity:0;visibility:hidden}
.top-bar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.res-box{background:rgba(0,0,0,.45);border:2px solid rgba(255,200,50,.4);border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:6px;color:#ffd700;font-weight:800;font-size:14px}
.res-box.gem{border-color:rgba(0,220,255,.45);color:#00e5ff}
.logo-area{text-align:center;margin-top:8px}
.logo{font-size:clamp(42px,11vw,68px);font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff 10%,#00ffd0 45%,#00aaff 70%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #1a0066) drop-shadow(0 0 40px rgba(0,255,210,.45));line-height:1}
.logo-sub{color:rgba(255,255,255,.5);font-size:12px;letter-spacing:3px;margin-top:4px;text-transform:uppercase}
.showcase{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;max-width:420px;padding:8px 0}
.brawler{width:96px;background:linear-gradient(180deg,rgba(30,20,60,.95),rgba(10,10,30,.98));border:3px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 6px 12px;text-align:center;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.brawler::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);pointer-events:none}
.brawler.on{transform:scale(1.08) translateY(-6px);border-color:var(--c,#00ffd0);box-shadow:0 0 0 2px var(--c),0 10px 30px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--c) 40%,transparent)}
.brawler .icon-wrap{width:56px;height:56px;margin:0 auto 6px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#111;box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.25)}
.brawler .name{color:#fff;font-weight:800;font-size:12px;text-shadow:0 1px 2px #000}
.brawler .role{color:rgba(255,255,255,.4);font-size:9px;margin-top:2px}
.brawler .trophy{position:absolute;top:6px;right:6px;font-size:10px;color:#ffd700;opacity:.7}
.play-wrap{width:100%;max-width:320px;margin-bottom:8px}
#go{width:100%;height:64px;background:linear-gradient(180deg,#5cff6a 0%,#00c853 40%,#00a844 100%);border:none;border-radius:18px;cursor:pointer;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 6px 0 #007a30,0 8px 20px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3);letter-spacing:2px;transition:transform .08s;position:relative}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #007a30,0 4px 12px rgba(0,0,0,.3)}
#go::after{content:'▶';position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:20px;opacity:.9}
.hint{color:rgba(255,255,255,.3);font-size:11px;text-align:center}
#hud{display:none}#hud.show{display:block}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:6px}
.hc{background:rgba(4,6,16,.88);border:1px solid rgba(0,255,210,.18);border-radius:14px;padding:6px 11px;color:#00ffd0;font-weight:700;font-size:13px;backdrop-filter:blur(14px)}
.hc .l{font-size:8px;opacity:.45;letter-spacing:.6px;display:block;text-transform:uppercase}
#hpbg{width:118px;height:10px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;margin-top:3px;border:1px solid rgba(255,40,40,.2)}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff1a1a,#ff6b20);border-radius:6px;transition:width .08s}
#spbg{width:118px;height:6px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid rgba(168,85,247,.25)}
#sp{height:100%;width:0;background:linear-gradient(90deg,#a855f7,#f472b6);border-radius:4px;transition:width .1s}
#feed{position:absolute;top:82px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.km{background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:4px 10px;border-radius:8px;border-left:3px solid #00ffd0;animation:fi .2s ease,fo .3s ease 1.8s forwards}
@keyframes fi{from{opacity:0;transform:translateX(16px)}}@keyframes fo{to{opacity:0;transform:translateX(8px)}}
#msg{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:30px;font-weight:900;text-align:center;text-shadow:0 0 40px rgba(0,255,210,.8);opacity:0;transition:opacity .2s;line-height:1.2}
#streak{position:absolute;top:46%;left:50%;transform:translate(-50%,-60px);color:#ffdd00;font-weight:900;font-size:24px;text-shadow:0 0 30px rgba(255,200,0,.7);opacity:0;transition:opacity .2s;pointer-events:none}
.fd{position:absolute;font-weight:900;font-size:17px;pointer-events:none;text-shadow:0 2px 6px #000;animation:df .6s ease-out forwards}
@keyframes df{0%{opacity:1;transform:translate(-50%,0) scale(1.35)}100%{opacity:0;transform:translate(-50%,-40px) scale(.7)}}
#jz{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:16px;width:130px;height:130px;pointer-events:auto}
#jb{width:130px;height:130px;border-radius:50%;background:rgba(0,255,210,.04);border:2px solid rgba(0,255,210,.12);position:relative}
#jk{width:52px;height:52px;border-radius:50%;background:rgba(0,255,210,.7);border:2px solid rgba(255,255,255,.35);position:absolute;top:39px;left:39px;box-shadow:0 0 16px rgba(0,255,210,.5)}
#az{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));right:16px;width:130px;height:130px;pointer-events:auto}
#ab{width:130px;height:130px;border-radius:50%;background:rgba(255,40,90,.05);border:2px solid rgba(255,40,90,.18);position:relative}
#ak{width:52px;height:52px;border-radius:50%;background:rgba(255,50,100,.65);border:2px solid rgba(255,255,255,.3);position:absolute;top:39px;left:39px;box-shadow:0 0 16px rgba(255,40,90,.45);opacity:.5;transition:opacity .1s}
#ak.active{opacity:1}
#bd{position:absolute;bottom:max(160px,calc(env(safe-area-inset-bottom)+145px));right:28px;width:50px;height:50px;border-radius:50%;background:rgba(40,140,255,.12);border:2px solid rgba(40,140,255,.45);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:17px;color:#288cff}
#bd.a{transform:scale(.86)}
#bdc{font-size:8px;color:#288cff;position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
#bu{position:absolute;bottom:max(160px,calc(env(safe-area-inset-bottom)+145px));right:90px;width:50px;height:50px;border-radius:50%;background:rgba(168,85,247,.12);border:2px solid rgba(168,85,247,.5);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:17px;color:#c084fc;opacity:.25;transition:opacity .2s}
#bu.r{opacity:1}#bu.a{transform:scale(.86)}
#bg{position:absolute;bottom:max(160px,calc(env(safe-area-inset-bottom)+145px));right:152px;width:50px;height:50px;border-radius:50%;background:rgba(255,190,40,.1);border:2px solid rgba(255,190,40,.45);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:#ffbe28;opacity:.28;transition:opacity .2s}
#bg.r{opacity:1}#bg.a{transform:scale(.86)}
#bgc{font-size:8px;color:#ffbe28;position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
#mmw{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:78px;height:78px;border-radius:12px;background:rgba(0,0,0,.6);border:1px solid rgba(0,255,210,.2);overflow:hidden}
#mmw canvas{width:100%;height:100%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .04s}
</style>
</head>
<body>
<div id="root">
  <div id="menu">
    <div class="top-bar">
      <div class="res-box">⭐ 1250</div>
      <div class="res-box gem">💎 80</div>
    </div>
    <div class="logo-area">
      <div class="logo">OVERCHARGE</div>
      <div class="logo-sub">Robot Arena</div>
    </div>
    <div class="showcase" id="sel"></div>
    <div class="play-wrap"><button id="go">FIGHT</button></div>
    <div class="hint">Wähle deinen Roboter</div>
  </div>
  <div id="hud">
    <div id="flash"></div>
    <div id="ui">
      <div id="top">
        <div class="hc"><span class="l">Health</span><div id="hpbg"><div id="hp"></div></div><div id="spbg"><div id="sp"></div></div></div>
        <div class="hc"><span class="l">Kills</span><span id="kl">0</span></div>
        <div class="hc"><span class="l">Time</span><span id="tm">3:00</span></div>
      </div>
      <div id="feed"></div>
      <div id="msg"></div>
      <div id="streak"></div>
      <div id="mmw"><canvas id="mm"></canvas></div>
    </div>
    <div id="jz"><div id="jb"><div id="jk"></div></div></div>
    <div id="az"><div id="ab"><div id="ak"></div></div></div>
    <div id="bd">⚡<div id="bdc"></div></div>
    <div id="bu">◈</div>
    <div id="bg">◆<div id="bgc"></div></div>
  </div>
</div>
<script>
// ===== COOLER ROBOT CHARACTERS =====
const BRS = [
  {
    id: 'nyx', name: 'NYX', icon: '◈', color: '#7bffb3', role: 'Phantom',
    // Ghost-like assassin: very fast, low HP, short-range burst + blink
    hp: 78, spd: 390, rate: .09, bSpd: 920, dmg: 14, bR: 5, dash: .7, cost: 65, gCd: 4.2,
    super(p) {
      // Phase dash + shotgun burst
      const a = p.angle;
      p.x += Math.cos(a) * 140; p.y += Math.sin(a) * 140;
      p.x = Math.max(p.r, Math.min(A - p.r, p.x));
      p.y = Math.max(p.r, Math.min(A - p.r, p.y));
      for (let i = -5; i <= 5; i++) bullet(p.x, p.y, a + i * .09, 880, 15, 5, 1, p.color, .45);
      burst(p.x, p.y, p.color, 50, 380); cam.sh = 18; flash(.12); p.inv = .35;
    },
    gadget(p) {
      // Cloak + speed
      p.inv = 1.4; p.spd = p.baseSpd * 1.7;
      setTimeout(() => { if (p.alive) p.spd = p.baseSpd; }, 1200);
      burst(p.x, p.y, '#fff', 20, 200);
    }
  },
  {
    id: 'titan-x', name: 'TITAN-X', icon: '⬡', color: '#ff8c42', role: 'Juggernaut',
    // Massive tank: slow, huge HP, ground slam + shield
    hp: 195, spd: 185, rate: .48, bSpd: 380, dmg: 55, bR: 14, dash: 2.3, cost: 140, gCd: 9,
    super(p) {
      cam.sh = 42; flash(.22);
      // Expanding shockwave rings
      for (let r = 0; r < 3; r++) {
        setTimeout(() => {
          for (let i = 0; i < 20; i++) {
            const a = (i / 20) * Math.PI * 2;
            bullet(p.x, p.y, a, 280 + r * 40, 28, 12, 1, p.color, .4);
          }
          burst(p.x, p.y, p.color, 30, 300 + r * 80);
        }, r * 120);
      }
      for (const b of bots) if (b.alive && dist(p, b) < 360) dmgBot(b, 80, 1);
    },
    gadget(p) {
      p.hp = Math.min(p.max, p.hp + 60);
      p.inv = .8;
      fDmg(p.x, p.y - 48, '+60', '#2ecc71');
      burst(p.x, p.y, '#2ecc71', 40, 280);
    }
  },
  {
    id: 'viper', name: 'VIPER', icon: '▣', color: '#c77dff', role: 'Railgun',
    // Long-range laser specialist: slow fire, high damage, piercing
    hp: 68, spd: 300, rate: .62, bSpd: 1600, dmg: 72, bR: 3.8, dash: 1.0, cost: 75, gCd: 5.5,
    super(p) {
      // Triple rail shot with delay
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          if (!p.alive) return;
          bullet(p.x, p.y, p.angle, 1800, 85, 4, 1, p.color, .9, 1);
          bullet(p.x, p.y, p.angle + .04, 1800, 40, 3, 1, p.color, .7, 1);
          bullet(p.x, p.y, p.angle - .04, 1800, 40, 3, 1, p.color, .7, 1);
          burst(p.x + Math.cos(p.angle) * 60, p.y + Math.sin(p.angle) * 60, p.color, 16, 120);
        }, i * 90);
      }
      cam.sh = 14; flash(.1);
    },
    gadget(p) {
      // Mark + rapid pierce shots
      p.inv = .25;
      for (let i = 0; i < 4; i++) {
        const a = p.angle + (i - 1.5) * .07;
        bullet(p.x, p.y, a, 1400, 38, 3.5, 1, p.color, .6, 1);
      }
    }
  },
  {
    id: 'ember', name: 'EMBER', icon: '⬡', color: '#ff4d6d', role: 'Demolisher',
    // Explosive area control: medium everything, cluster bombs
    hp: 120, spd: 255, rate: .28, bSpd: 480, dmg: 22, bR: 9, dash: 1.3, cost: 85, gCd: 6,
    super(p) {
      // Napalm zones
      for (let i = 0; i < 9; i++) {
        const a = p.angle + (i - 4) * .22;
        const bx = p.x + Math.cos(a) * (90 + i * 12);
        const by = p.y + Math.sin(a) * (90 + i * 12);
        setTimeout(() => {
          burst(bx, by, p.color, 48, 420); cam.sh = 11;
          for (const b of bots) if (b.alive && Math.hypot(b.x - bx, b.y - by) < 175) dmgBot(b, 48, 1);
        }, 80 + i * 70);
      }
      burst(p.x, p.y, p.color, 36, 300); flash(.14);
    },
    gadget(p) {
      // Mine ring
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        bullet(p.x, p.y, a, 320, 18, 9, 1, p.color, .7);
      }
      burst(p.x, p.y, p.color, 24, 220);
    }
  },
];

let sel = BRS[0];
const selEl = document.getElementById('sel');
BRS.forEach((b, i) => {
  const c = document.createElement('div');
  c.className = 'brawler' + (i === 0 ? ' on' : '');
  c.style.setProperty('--c', b.color);
  c.innerHTML = `<div class="trophy">🏆</div><div class="icon-wrap" style="background:${b.color}">${b.icon}</div><div class="name">${b.name}</div><div class="role">${b.role}</div>`;
  c.onclick = () => { document.querySelectorAll('.brawler').forEach(x => x.classList.remove('on')); c.classList.add('on'); sel = b; };
  selEl.appendChild(c);
});
document.getElementById('go').onclick = () => start();

let ac = null;
function aud() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext); if (ac.state === 'suspended') ac.resume(); }
function beep(f, d, t = 'square', v = .05, s = 0) { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = t; o.frequency.setValueAtTime(f, ac.currentTime); if (s) o.frequency.linearRampToValueAtTime(f + s, ac.currentTime + d); g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); }
const sfx = { shoot: () => beep(620, .028, 'square', .032, -300), hit: () => beep(125, .055, 'sawtooth', .065, -40), dash: () => beep(150, .075, 'sine', .055, 500), super: () => { beep(55, .2, 'sawtooth', .08, 400); beep(240, .1, 'square', .03); }, kill: () => { beep(400, .035, 'square', .065); setTimeout(() => beep(640, .06, 'square', .045), 28); }, hurt: () => beep(60, .09, 'sawtooth', .08, -18), power: () => { beep(520, .055, 'sine', .06); beep(820, .07, 'sine', .035); }, streak: () => { beep(360, .035, 'square', .05); setTimeout(() => beep(580, .05, 'square', .04), 32); }, gad: () => beep(320, .07, 'triangle', .055, 260) };
function flash(a = .1) { const el = document.getElementById('flash'); el.style.opacity = a; setTimeout(() => el.style.opacity = 0, 45); }

const A = 1750;
let P, bullets, bots, parts, powers, obs, cam, time, over, last, hitstop, run = 0, streak = 0, streakT = 0;
const canvas = document.createElement('canvas');
document.getElementById('root').insertBefore(canvas, document.getElementById('root').firstChild);
const ctx = canvas.getContext('2d');
const mmC = document.getElementById('mm'), mmX = mmC.getContext('2d');
let W, H;
function resize() { W = innerWidth; H = innerHeight; canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio; canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); mmC.width = 78; mmC.height = 78; }
addEventListener('resize', resize); resize();

const inp = { mx: 0, my: 0, ax: 0, ay: 0, aiming: false, dash: 0, super: 0, gad: 0 };
const JR = 46;
const jk = document.getElementById('jk');
let jid = null, jm = 0;
function setJoy(cx, cy, baseId, knob, isAim) {
  const r = document.getElementById(baseId).getBoundingClientRect();
  const mx = r.left + r.width / 2, my = r.top + r.height / 2;
  let dx = cx - mx, dy = cy - my, d = Math.hypot(dx, dy);
  if (d > JR) { dx = dx / d * JR; dy = dy / d * JR; }
  knob.style.left = (39 + dx) + 'px'; knob.style.top = (39 + dy) + 'px';
  if (isAim) { inp.ax = dx / JR; inp.ay = dy / JR; inp.aiming = d > 8; }
  else { inp.mx = dx / JR; inp.my = dy / JR; }
}
function resJoy(knob, isAim) {
  knob.style.left = '39px'; knob.style.top = '39px';
  if (isAim) { inp.ax = 0; inp.ay = 0; inp.aiming = false; document.getElementById('ak').classList.remove('active'); }
  else { inp.mx = 0; inp.my = 0; }
}
const jz = document.getElementById('jz');
jz.addEventListener('touchstart', e => { e.preventDefault(); aud(); jid = e.changedTouches[0].identifier; setJoy(e.changedTouches[0].clientX, e.changedTouches[0].clientY, 'jb', jk, false); }, { passive: false });
jz.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === jid) setJoy(t.clientX, t.clientY, 'jb', jk, false); }, { passive: false });
jz.addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === jid) { resJoy(jk, false); jid = null; } });
jz.addEventListener('mousedown', e => { jm = 1; aud(); setJoy(e.clientX, e.clientY, 'jb', jk, false); });
addEventListener('mousemove', e => { if (jm) setJoy(e.clientX, e.clientY, 'jb', jk, false); });
addEventListener('mouseup', () => { if (jm) { resJoy(jk, false); jm = 0; } });
const ak = document.getElementById('ak');
let aid = null, am = 0;
const az = document.getElementById('az');
az.addEventListener('touchstart', e => { e.preventDefault(); aud(); aid = e.changedTouches[0].identifier; ak.classList.add('active'); setJoy(e.changedTouches[0].clientX, e.changedTouches[0].clientY, 'ab', ak, true); }, { passive: false });
az.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === aid) setJoy(t.clientX, t.clientY, 'ab', ak, true); }, { passive: false });
az.addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === aid) { resJoy(ak, true); aid = null; } });
az.addEventListener('mousedown', e => { am = 1; aud(); ak.classList.add('active'); setJoy(e.clientX, e.clientY, 'ab', ak, true); });
addEventListener('mousemove', e => { if (am) setJoy(e.clientX, e.clientY, 'ab', ak, true); });
addEventListener('mouseup', () => { if (am) { resJoy(ak, true); am = 0; } });
function btn(id, k) { const el = document.getElementById(id); el.addEventListener('touchstart', e => { e.preventDefault(); aud(); inp[k] = 1; el.classList.add('a'); }, { passive: false }); el.addEventListener('touchend', () => { inp[k] = 0; el.classList.remove('a'); }); el.addEventListener('mousedown', () => { aud(); inp[k] = 1; el.classList.add('a'); }); el.addEventListener('mouseup', () => { inp[k] = 0; el.classList.remove('a'); }); el.addEventListener('mouseleave', () => { inp[k] = 0; el.classList.remove('a'); }); }
btn('bd', 'dash'); btn('bu', 'super'); btn('bg', 'gad');
const keys = {};
addEventListener('keydown', e => { aud(); keys[e.key.toLowerCase()] = 1; if (e.key === 'Shift') inp.dash = 1; if (e.key === 'e' || e.key === 'E') inp.super = 1; if (e.key === 'q' || e.key === 'Q') inp.gad = 1; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function dmgBot(bot, dmg, isSuper) {
  bot.hp -= dmg; P.sup = Math.min(P.cost, P.sup + (isSuper ? 3 : 8));
  burst(bot.x, bot.y, bot.col, isSuper ? 22 : 10, isSuper ? 300 : 140);
  fDmg(bot.x, bot.y - 22, Math.round(dmg), isSuper ? '#c084fc' : '#fff');
  cam.sh = isSuper ? 15 : 5; hitstop = isSuper ? .05 : .015; sfx.hit();
  if (bot.hp <= 0) {
    bot.alive = 0; bot.hp = 0; P.kills++; streak++; streakT = 4.5;
    if (streak >= 2) showStreak(streak);
    burst(bot.x, bot.y, bot.col, 50, 500); sfx.kill(); flash(.09);
    feed(`Eliminated #${bot.id + 1}`);
    msg(streak >= 6 ? 'GODLIKE!' : streak >= 3 ? 'RAMPAGE!' : 'ELIMINATED!', .45);
    hitstop = .07; P.hp = Math.min(P.max, P.hp + 12);
    setTimeout(() => { if (over) return; let x, y; do { x = 160 + Math.random() * (A - 320); y = 160 + Math.random() * (A - 320); } while (Math.hypot(x - P.x, y - P.y) < 400); bot.x = x; bot.y = y; bot.hp = bot.max; bot.alive = 1; bot.target = null; }, 2800);
  }
