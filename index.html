<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Overcharge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a18;font-family:system-ui,-apple-system,sans-serif}
#root{width:100%;height:100%;position:relative}
canvas{display:block}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#menu{position:absolute;inset:0;z-index:30;pointer-events:auto;background:radial-gradient(ellipse at 50% 0%,#1a1040 0%,transparent 45%),radial-gradient(ellipse at 20% 80%,#0a2a4a 0%,transparent 40%),radial-gradient(ellipse at 80% 70%,#2a1040 0%,transparent 35%),linear-gradient(180deg,#0c0c22 0%,#060614 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));transition:opacity .35s,visibility .35s;overflow:hidden}
#menu.hide{opacity:0;visibility:hidden}
.top-bar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.res-box{background:rgba(0,0,0,.45);border:2px solid rgba(255,200,50,.4);border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:6px;color:#ffd700;font-weight:800;font-size:14px}
.res-box.gem{border-color:rgba(0,220,255,.45);color:#00e5ff}
.logo-area{text-align:center;margin-top:8px}
.logo{font-size:clamp(42px,11vw,68px);font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff 10%,#00ffd0 45%,#00aaff 70%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #1a0066) drop-shadow(0 0 40px rgba(0,255,210,.45));line-height:1}
.logo-sub{color:rgba(255,255,255,.5);font-size:12px;letter-spacing:3px;margin-top:4px;text-transform:uppercase}
.showcase{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;max-width:480px;padding:8px 0}
.brawler{width:88px;background:linear-gradient(180deg,rgba(30,20,60,.95),rgba(10,10,30,.98));border:3px solid rgba(255,255,255,.12);border-radius:18px;padding:8px 4px 10px;text-align:center;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.brawler::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);pointer-events:none}
.brawler.on{transform:scale(1.08) translateY(-6px);border-color:var(--c,#00ffd0);box-shadow:0 0 0 2px var(--c),0 10px 30px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--c) 40%,transparent)}
.brawler .icon-wrap{width:56px;height:56px;margin:0 auto 4px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.brawler .icon-wrap svg{width:52px;height:52px;filter:drop-shadow(0 0 6px var(--c))}
.brawler .name{color:#fff;font-weight:800;font-size:11px;text-shadow:0 1px 2px #000}
.brawler .role{color:rgba(255,255,255,.4);font-size:8px;margin-top:1px}
.brawler .trophy{position:absolute;top:4px;right:4px;font-size:9px;color:#ffd700;opacity:.7}
.play-wrap{width:100%;max-width:320px;margin-bottom:8px}
#go{width:100%;height:64px;background:linear-gradient(180deg,#5cff6a 0%,#00c853 40%,#00a844 100%);border:none;border-radius:18px;cursor:pointer;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 6px 0 #007a30,0 8px 20px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3);letter-spacing:2px;transition:transform .08s;position:relative}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #007a30,0 4px 12px rgba(0,0,0,.3)}
#go::after{content:'▶';position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:20px;opacity:.9}
.hint{color:rgba(255,255,255,.3);font-size:11px;text-align:center}
#hud{display:none}#hud.show{display:block}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:6px}
.hc{background:rgba(4,6,16,.88);border:1px solid rgba(0,255,210,.18);border-radius:14px;padding:6px 11px;color:#00ffd0;font-weight:700;font-size:13px;backdrop-filter:blur(14px)}
.hc .l{font-size:8px;opacity:.45;letter-spacing:.6px;display:block;text-transform:uppercase}
#hpbg{width:118px;height:10px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;margin-top:3px;border:1px solid rgba(255,40,40,.2)}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff1a1a,#ff6b20);border-radius:6px;transition:width .08s}
#spbg{width:118px;height:6px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid rgba(168,85,247,.25)}
#sp{height:100%;width:0;background:linear-gradient(90deg,#a855f7,#f472b6);border-radius:4px;transition:width .1s}
#feed{position:absolute;top:82px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.km{background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:4px 10px;border-radius:8px;border-left:3px solid #00ffd0;animation:fi .2s ease,fo .3s ease 1.8s forwards}
@keyframes fi{from{opacity:0;transform:translateX(16px)}}@keyframes fo{to{opacity:0;transform:translateX(8px)}}
#msg{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:30px;font-weight:900;text-align:center;text-shadow:0 0 40px rgba(0,255,210,.8);opacity:0;transition:opacity .2s;line-height:1.2}
#streak{position:absolute;top:46%;left:50%;transform:translate(-50%,-60px);color:#ffdd00;font-weight:900;font-size:24px;text-shadow:0 0 30px rgba(255,200,0,.7);opacity:0;transition:opacity .2s;pointer-events:none}
.fd{position:absolute;font-weight:900;font-size:17px;pointer-events:none;text-shadow:0 2px 6px #000;animation:df .6s ease-out forwards}
@keyframes df{0%{opacity:1;transform:translate(-50%,0) scale(1.35)}100%{opacity:0;transform:translate(-50%,-40px) scale(.7)}}
#jz{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:16px;width:130px;height:130px;pointer-events:auto}
#jb{width:130px;height:130px;border-radius:50%;background:rgba(0,255,210,.04);border:2px solid rgba(0,255,210,.12);position:relative}
#jk{width:52px;height:52px;border-radius:50%;background:rgba(0,255,210,.7);border:2px solid rgba(255,255,255,.35);position:absolute;top:39px;left:39px;box-shadow:0 0 16px rgba(0,255,210,.5)}
#az{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));right:16px;width:130px;height:130px;pointer-events:auto}
#ab{width:130px;height:130px;border-radius:50%;background:rgba(255,40,90,.05);border:2px solid rgba(255,40,90,.18);position:relative}
#ak{width:52px;height:52px;border-radius:50%;background:rgba(255,50,100,.65);border:2px solid rgba(255,255,255,.3);position:absolute;top:39px;left:39px;box-shadow:0 0 16px rgba(255,40,90,.45);opacity:.5;transition:opacity .1s}
#ak.active{opacity:1}
#bd{position:absolute;bottom:max(160px,calc(env(safe-area-inset-bottom)+145px));right:28px;width:50px;height:50px;border-radius:50%;background:rgba(40,140,255,.12);border:2px solid rgba(40,140,255,.45);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:17px;color:#288cff}
#bd.a{transform:scale(.86)}
#bdc{font-size:8px;color:#288cff;position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
#bu{position:absolute;bottom:max(160px,calc(env(safe-area-inset-bottom)+145px));right:90px;width:50px;height:50px;border-radius:50%;background:rgba(168,85,247,.12);border:2px solid rgba(168,85,247,.5);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:17px;color:#c084fc;opacity:.25;transition:opacity .2s}
#bu.r{opacity:1}#bu.a{transform:scale(.86)}
#bg{position:absolute;bottom:max(160px,calc(env(safe-area-inset-bottom)+145px));right:152px;width:50px;height:50px;border-radius:50%;background:rgba(255,190,40,.1);border:2px solid rgba(255,190,40,.45);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:#ffbe28;opacity:.28;transition:opacity .2s}
#bg.r{opacity:1}#bg.a{transform:scale(.86)}
#bgc{font-size:8px;color:#ffbe28;position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
#mmw{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:78px;height:78px;border-radius:12px;background:rgba(0,0,0,.6);border:1px solid rgba(0,255,210,.2);overflow:hidden}
#mmw canvas{width:100%;height:100%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .04s}
</style>
</head>
<body>
<div id="root">
  <div id="menu">
    <div class="top-bar">
      <div class="res-box">⭐ 1250</div>
      <div class="res-box gem">💎 80</div>
    </div>
    <div class="logo-area">
      <div class="logo">OVERCHARGE</div>
      <div class="logo-sub">Robot Arena</div>
    </div>
    <div class="showcase" id="sel"></div>
    <div class="play-wrap"><button id="go">FIGHT</button></div>
    <div class="hint">Wähle deinen Roboter</div>
  </div>
  <div id="hud">
    <div id="flash"></div>
    <div id="ui">
      <div id="top">
        <div class="hc"><span class="l">Health</span><div id="hpbg"><div id="hp"></div></div><div id="spbg"><div id="sp"></div></div></div>
        <div class="hc"><span class="l">Kills</span><span id="kl">0</span></div>
        <div class="hc"><span class="l">Time</span><span id="tm">3:00</span></div>
      </div>
      <div id="feed"></div>
      <div id="msg"></div>
      <div id="streak"></div>
      <div id="mmw"><canvas id="mm"></canvas></div>
    </div>
    <div id="jz"><div id="jb"><div id="jk"></div></div></div>
    <div id="az"><div id="ab"><div id="ak"></div></div></div>
    <div id="bd">⚡<div id="bdc"></div></div>
    <div id="bu">◈</div>
    <div id="bg">◆<div id="bgc"></div></div>
  </div>
</div>
<script>
// ===== MODELS (canvas + SVG) =====
const R=(x,y,w,h)=>[[x,y-h/2],[x+w,y-h/2],[x+w,y+h/2],[x,y+h/2]];
const Mi=p=>p.map(([a,b])=>[a,-b]).reverse();
const S=(p,k,o)=>[{p,k,o},{p:Mi(p),k,o}];
const C=(x,y,r,k,o)=>({x,y,r,k,o});
const Poly=(p,k,o)=>({p,k,o});
const star=(n,a,b)=>Array.from({length:n*2},(_,i)=>{const r=i%2?b:a,t=i*Math.PI/n;return[+(Math.cos(t)*r).toFixed(3),+(Math.sin(t)*r).toFixed(3)]});

const MODELS={
nyx:{name:'NYX',role:'Phantom',c:{b:'#7bffb3',a:'#3fd68a',d:'#0d2b1f',g:'#fff'},s:[
  ...S([[.1,.3],[-.5,.95],[-.8,.9],[-.45,.25]],'a'),
  Poly([[1,0],[.25,.34],[-.6,.3],[-.8,0],[-.6,-.3],[.25,-.34]],'b'),
  Poly([[.5,0],[0,.14],[-.5,.1],[-.5,-.1],[0,-.14]],'d'),C(.45,0,.1,'g')]},
'titan-x':{name:'TITAN-X',role:'Juggernaut',c:{b:'#ff8c42',a:'#ffbe85',d:'#3a1a08',g:'#ffe9a8'},s:[
  Poly([[.8,.35],[.45,.85],[-.45,.85],[-.85,.4],[-.85,-.4],[-.45,-.85],[.45,-.85],[.8,-.35]],'b'),
  ...S(R(-.25,.8,.6,.22),'a'),Poly(R(.4,0,.7,.36),'d'),Poly(R(1.1,0,.12,.46),'a'),
  C(-.2,0,.4,'a'),C(-.2,0,.22,'g')]},
viper:{name:'VIPER',role:'Railgun',c:{b:'#c77dff',a:'#8f4fd1',d:'#241038',g:'#f5e1ff'},s:[
  ...S([[-.2,.25],[-.7,.8],[-.95,.8],[-.7,.25]],'a'),
  Poly([[1.1,0],[.3,.2],[-.8,.28],[-.95,0],[-.8,-.28],[.3,-.2]],'b'),
  Poly(R(.3,0,.9,.1),'d'),...S(R(.3,.14,.8,.05),'g'),C(.1,0,.16,'a'),C(.1,0,.07,'g')]},
ember:{name:'EMBER',role:'Demolisher',c:{b:'#ff4d6d',a:'#ff9aab',d:'#3a0c16',g:'#ffd166'},s:[
  ...S(R(.2,.4,.9,.26),'d'),...S(R(1.05,.4,.1,.3),'a'),...S(R(-.95,.3,.35,.16),'a'),
  C(0,0,.8,'b'),C(-.1,0,.3,'a'),C(-.1,0,.16,'g')]},
volt:{name:'VOLT',role:'Storm',c:{b:'#ffd23f',a:'#fff09a',d:'#3a3008',g:'#7df9ff'},s:[
  ...S(R(-.8,.3,.5,.22),'d'),
  Poly([[.9,0],[0,.7],[-.8,.4],[-.8,-.4],[0,-.7]],'b'),
  ...S(R(.3,.22,.75,.08),'a'),C(1.05,.22,.08,'g'),C(1.05,-.22,.08,'g'),
  C(.2,0,.3,'d'),C(.2,0,.18,'g')]},
aegis:{name:'AEGIS',role:'Guardian',c:{b:'#4da3ff',a:'#a9d4ff',d:'#0b2340',g:'#fff'},s:[
  ...S(R(-.9,.3,.3,.2),'d'),C(0,0,.65,'b'),Poly(R(.2,0,.6,.16),'d'),
  Poly([[.7,.95],[1,.5],[1,-.5],[.7,-.95],[.45,-.7],[.6,-.3],[.6,.3],[.45,.7]],'a'),
  C(-.1,0,.2,'g')]},
hive:{name:'HIVE',role:'Swarm',c:{b:'#5dff7a',a:'#2bb84a',d:'#0b2e14',g:'#eaffb0'},s:[
  ...Array.from({length:6},(_,i)=>C(+(Math.cos(i*1.047)*.8).toFixed(3),+(Math.sin(i*1.047)*.8).toFixed(3),.2,'a',.8)),
  Poly(R(.4,0,.5,.14),'d'),C(0,0,.55,'b'),C(.25,0,.14,'g')]},
nova:{name:'NOVA',role:'Starcaster',c:{b:'#ff5fd2',a:'#ffa6ea',d:'#3a0c30',g:'#fff'},s:[
  Poly(star(8,1,.55),'a',.5),Poly([[1.05,0],[.5,.14],[.5,-.14]],'d'),
  C(0,0,.6,'b'),C(0,0,.4,'d'),C(0,0,.25,'g')]}
};
const MODEL_IDS=Object.keys(MODELS);

function drawModel(c,m,x,y,r,a,t=0){
  c.save();c.translate(x,y);c.rotate(a);c.scale(r,r);
  c.lineWidth=.05;c.lineJoin='round';c.strokeStyle='rgba(0,0,0,.55)';
  for(const s of m.s){
    c.save();if(s.o)c.rotate(t*s.o);
    c.fillStyle=m.c[s.k];c.shadowColor=m.c.g;c.shadowBlur=s.k==='g'?r*.5:0;c.beginPath();
    if(s.p)s.p.forEach(([u,v],i)=>i?c.lineTo(u,v):c.moveTo(u,v)),c.closePath();else c.arc(s.x,s.y,s.r,0,6.283);
    c.fill();c.shadowBlur=0;c.stroke();c.restore();
  }
  c.restore();
}
function modelSVG(m){
  let o=`<svg viewBox="-1.25 -1.25 2.5 2.5" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-90)" stroke="rgba(0,0,0,.55)" stroke-width=".05" stroke-linejoin="round">`;
  for(const s of m.s){
    const f=m.c[s.k],e=s.p?`<polygon points="${s.p.join(' ')}" fill="${f}"/>`:`<circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="${f}"/>`;
    o+=s.o?`<g>${e}<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="${(6.283/s.o).toFixed(1)}s" repeatCount="indefinite"/></g>`:e;
  }
  return o+'</g></svg>';
}

// ===== SCHUSS-FX =====
function makeFX(){
  const B=[],Q=[],Rg=[],T=[],rnd=(a,b)=>a+Math.random()*(b-a);
  const spark=(x,y,a,col,n,v0,v1,sp)=>{for(let i=0;i<n;i++){const d=a+rnd(-sp,sp),v=rnd(v0,v1);Q.push({x,y,vx:Math.cos(d)*v,vy:Math.sin(d)*v,l:rnd(.2,.45),t:0,col})}};
  return{
    muzzle(x,y,a,col){Rg.push({k:0,x,y,a,col,t:0,l:.12});spark(x,y,a,col,5,200,520,.5)},
    hit(x,y,col){Rg.push({k:1,x,y,col,t:0,l:.35,s:50});spark(x,y,0,col,16,120,420,Math.PI)},
    boom(x,y,col){Rg.push({k:1,x,y,col,t:0,l:.6,s:95});Rg.push({k:1,x,y,col:'#ffffff',t:0,l:.25,s:40});spark(x,y,0,col,40,150,700,Math.PI)},
    num(x,y,s,col){T.push({x,y,s,col,t:0})},
    update(dt){
      for(let i=Q.length-1;i>=0;i--){const p=Q[i];p.t+=dt;const d=Math.pow(.02,dt);p.vx*=d;p.vy*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.l)Q.splice(i,1)}
      for(let i=Rg.length-1;i>=0;i--){Rg[i].t+=dt;if(Rg[i].t>Rg[i].l)Rg.splice(i,1)}
      for(let i=T.length-1;i>=0;i--){T[i].t+=dt;if(T[i].t>.7)T.splice(i,1)}
    },
    draw(c){
      c.save();c.globalCompositeOperation='lighter';c.lineCap='round';
      for(const r of Rg){
        const u=r.t/r.l;c.globalAlpha=1-u;
        if(!r.k){c.save();c.translate(r.x,r.y);c.rotate(r.a);c.fillStyle=r.col;c.beginPath();c.moveTo(0,-9*(1-u));c.lineTo(48*(1-u*.4),0);c.lineTo(0,9*(1-u));c.closePath();c.fill();
          c.fillStyle='#fff';c.beginPath();c.arc(0,0,10*(1-u),0,6.283);c.fill();c.restore()}
        else{c.strokeStyle=r.col;c.lineWidth=1+4*(1-u);c.beginPath();c.arc(r.x,r.y,r.s*(1-(1-u)*(1-u)),0,6.283);c.stroke();
          c.globalAlpha=(1-u)*(1-u)*.7;c.fillStyle='#fff';c.beginPath();c.arc(r.x,r.y,r.s*.25,0,6.283);c.fill()}
      }
      c.lineWidth=2;
      for(const p of Q){c.globalAlpha=1-p.t/p.l;c.strokeStyle=p.col;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);c.stroke()}
      c.globalCompositeOperation='source-over';c.font='bold 16px system-ui';c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.6)';
      for(const n of T){const u=n.t/.7;c.globalAlpha=1-u;c.fillStyle=n.col;c.strokeText(n.s,n.x,n.y-30*u);c.fillText(n.s,n.x,n.y-30*u)}
      c.restore();
    }
  };
}
function drawAim(c,p,t,tg){
  const L=tg?Math.hypot(tg.x-p.x,tg.y-p.y):p.rng,co=Math.cos(p.a),si=Math.sin(p.a),
    sx=p.x+co*p.r*1.3,sy=p.y+si*p.r*1.3,ex=p.x+co*L,ey=p.y+si*L,col=tg?'#ff3b5c':p.col,
    rr=(tg?tg.r+12:28)+(1-p.lk)*18+(tg?0:Math.sin(t*6)*3);
  c.save();c.globalCompositeOperation='lighter';c.lineCap='round';
  const g=c.createLinearGradient(sx,sy,ex,ey);g.addColorStop(0,col);g.addColorStop(1,col+'00');
  c.strokeStyle=g;c.globalAlpha=.22;c.lineWidth=9;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.stroke();
  c.globalAlpha=.95;c.lineWidth=2;c.setLineDash([12,10]);c.lineDashOffset=-t*150;c.stroke();c.setLineDash([]);
  c.strokeStyle=p.col;c.lineWidth=2.5;c.globalAlpha=.7;c.beginPath();c.arc(p.x,p.y,p.r*1.6,p.a+.55,p.a+6.283-.55);c.stroke();
  c.save();c.translate(p.x,p.y);c.rotate(p.a);c.translate(p.r*1.6+6+Math.sin(t*9)*3,0);c.beginPath();c.moveTo(-7,-8);c.lineTo(3,0);c.lineTo(-7,8);c.stroke();c.restore();
  c.save();c.translate(ex,ey);c.strokeStyle=c.fillStyle=col;c.globalAlpha=1;c.lineWidth=2.5;c.rotate(tg?Math.PI/4:t*1.6);
  for(let i=0;i<4;i++){c.rotate(Math.PI/2);c.beginPath();c.arc(0,0,rr,-.38,.38);c.stroke();c.beginPath();c.moveTo(rr-9,0);c.lineTo(rr-2,0);c.stroke()}
  c.beginPath();c.arc(0,0,tg?4:2.5,0,6.283);c.fill();c.restore();
  if(tg){c.font='bold 11px system-ui';c.textAlign='center';c.fillStyle=col;c.fillText('LOCK',ex,ey-rr-8)}
  c.restore();
}

// ===== COOLER ROBOT CHARACTERS =====
const BRS = [
  {

    rusher:   { hp: 78,  spd: 290, r: 19, modelPool: ['ember', 'volt', 'hive'] },
    shooter:  { hp: 88,  spd: 215, r: 20, modelPool: ['viper', 'nova', 'nyx'] },
    tank:     { hp: 165, spd: 125, r: 28, modelPool: ['titan-x', 'aegis'] },
    assassin: { hp: 58,  spd: 340, r: 17, modelPool: ['nyx', 'volt', 'viper'] }
  };
  const types = ['rusher', 'shooter', 'tank', 'assassin'];
  for (let i = 0; i < 9; i++) {
    let x, y; do { x = 170 + Math.random() * (A - 340); y = 170 + Math.random() * (A - 340); } while (Math.hypot(x - P.x, y - P.y) < 450);
    const t = types[i % 4];
    const a = ARCH[t];
    const mid = a.modelPool[i % a.modelPool.length];
    const mcol = MODELS[mid].c.b;
    bots.push({
      x, y, vx: 0, vy: 0, angle: 0,
      hp: a.hp, max: a.hp, r: a.r, spd: a.spd,
      col: mcol, type: t, modelId: mid,
      fCd: Math.random() * .4, aiT: 0, tA: 0, alive: 1, id: i,
      target: null, strafeDir: Math.random() > .5 ? 1 : -1, coverT: 0
    });
  }
}
function spawnPow() { if (powers.length >= 3) return; let x, y, ok; do { x = 160 + Math.random() * (A - 320); y = 160 + Math.random() * (A - 320); ok = 1; for (const o of obs) if (cRect(x, y, 18, o.x, o.y, o.w, o.h)) ok = 0; } while (!ok); powers.push({ x, y, type: ['heal', 'super', 'rage'][Math.floor(Math.random() * 3)], life: 12, pul: 0 }); }

function update(dt) {
  if (!run || over) return; if (hitstop > 0) { hitstop -= dt; return; }
  time -= dt; if (time <= 0) { time = 0; end(P.kills >= 7); }
  if (Math.random() < 0.006) spawnPow();
  if (streakT > 0) { streakT -= dt; if (streakT <= 0) streak = 0; }

  let mx = inp.mx, my = inp.my;
  if (keys['w'] || keys['arrowup']) my = -1; if (keys['s'] || keys['arrowdown']) my = 1;
  if (keys['a'] || keys['arrowleft']) mx = -1; if (keys['d'] || keys['arrowright']) mx = 1;
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  if (P.dT > 0) P.dT -= dt; else { const sp = P.spd * (streak >= 3 ? 1.14 : 1); P.vx = mx * sp; P.vy = my * sp; }
  if (inp.dash && P.dCd <= 0 && ml > 0.1) { const inv = 1 / (ml || 1); P.vx = mx * inv * 1100; P.vy = my * inv * 1100; P.dT = .09; P.dCd = P.dMax; P.inv = .14; burst(P.x, P.y, '#288cff', 32, 430); sfx.dash(); inp.dash = 0; }
  if (P.dCd > 0) P.dCd -= dt; if (P.inv > 0) P.inv -= dt; if (P.gCd > 0) P.gCd -= dt;
  P.x += P.vx * dt; P.y += P.vy * dt; P.x = clamp(P.x, P.r, A - P.r); P.y = clamp(P.y, P.r, A - P.r);
  for (const o of obs) push(P, o);
  if (ml > 0.08) P.angle = Math.atan2(my, mx);

  if (inp.aiming) {
    P.angle = Math.atan2(inp.ay, inp.ax);
    P.fCd -= dt;
    if (P.fCd <= 0 && P.alive) {
      P.fCd = P.rate;
      bullet(P.x, P.y, P.angle, P.bSpd, P.dmg, P.bR, 1, P.col, 1, 0, 'player');
      const mx = P.x + Math.cos(P.angle) * P.r, my = P.y + Math.sin(P.angle) * P.r;
      fx.muzzle(mx, my, P.angle, P.col);
      pRec = 1;
      burst(mx, my, P.col, 3, 70);
      sfx.shoot();
    }
  } else P.fCd -= dt;
  pRec = Math.max(0, pRec - dt * 8);

  if (P.dT > 0 || ml > 0.2) { P.trail.push({ x: P.x, y: P.y, life: .14 }); if (P.trail.length > 20) P.trail.shift(); }
  for (let i = P.trail.length - 1; i >= 0; i--) { P.trail[i].life -= dt; if (P.trail[i].life <= 0) P.trail.splice(i, 1); }

  if (inp.super && P.sup >= P.cost && P.alive) { P.sup = 0; inp.super = 0; sfx.super(); P.br.super(P); msg('OVERCHARGE!', .5); }
  document.getElementById('bu').classList.toggle('r', P.sup >= P.cost);
  if (inp.gad && P.gCd <= 0 && P.alive) { P.gCd = P.gMax; inp.gad = 0; sfx.gad(); P.br.gadget(P); }
  document.getElementById('bg').classList.toggle('r', P.gCd <= 0);
  document.getElementById('bgc').textContent = P.gCd > 0 ? P.gCd.toFixed(1) + 's' : '';

  for (const bot of bots) {
    if (!bot.alive) continue;
    bot.aiT -= dt; bot.fCd -= dt; bot.coverT -= dt;
    if (bot.aiT <= 0 || !bot.target || !bot.target.alive) { bot.target = findBestTarget(bot); bot.aiT = .22 + Math.random() * .4; bot.strafeDir = Math.random() > .5 ? 1 : -1; }
    const target = bot.target; let moveA = bot.tA;
    if (target) {
      const d = dist(bot, target), aT = ang(bot, target), low = bot.hp / bot.max < .38;
      if (low && bot.coverT <= 0 && Math.random() < .3) { moveA = ang(bot, { x: obs[Math.floor(Math.random() * obs.length)].x, y: obs[0].y }); bot.coverT = 1.1 + Math.random(); }
      else if (bot.type === 'rusher') moveA = d > 85 ? aT : aT + Math.PI * .55 * bot.strafeDir;
      else if (bot.type === 'tank') moveA = d > 190 ? aT : aT + (Math.random() - .5) * 1.7;
      else if (bot.type === 'assassin') moveA = d > 150 ? aT : d < 65 ? aT + Math.PI : aT + 1.15 * bot.strafeDir;
      else moveA = d < 170 ? aT + Math.PI + (Math.random() - .5) * .7 : d > 360 ? aT : aT + 1.05 * bot.strafeDir;
      moveA = avoidObs(bot, moveA);
      const bSpd = bot.type === 'shooter' ? 590 : bot.type === 'tank' ? 295 : 410;
      bot.angle = predictAim(bot, target, bSpd);
      const range = bot.type === 'shooter' ? 620 : bot.type === 'tank' ? 270 : bot.type === 'assassin' ? 230 : 310;
      const rate = bot.type === 'shooter' ? .36 : bot.type === 'tank' ? .68 : bot.type === 'assassin' ? .52 : .48;
      if (d < range && bot.fCd <= 0) {
        let diff = bot.angle - aT; while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) < .5) { bot.fCd = rate + Math.random() * .12; const sp = bot.type === 'shooter' ? .035 : .16; const a = bot.angle + (Math.random() - .5) * sp; const spd = bot.type === 'shooter' ? 610 : bot.type === 'tank' ? 285 : 430; const dmg = bot.type === 'tank' ? 15 : bot.type === 'assassin' ? 13 : 10; bullet(bot.x, bot.y, a, spd, dmg, 5.5, 0, bot.col, 1.15, 0, bot); }
      }
    } else if (bot.aiT <= 0) { moveA = Math.random() * Math.PI * 2; bot.aiT = .7 + Math.random(); }
    bot.tA = moveA; bot.vx = Math.cos(moveA) * bot.spd; bot.vy = Math.sin(moveA) * bot.spd;
    bot.x += bot.vx * dt; bot.y += bot.vy * dt; bot.x = clamp(bot.x, bot.r, A - bot.r); bot.y = clamp(bot.y, bot.r, A - bot.r);
    for (const o of obs) push(bot, o);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    b.trail.push({ x: b.x, y: b.y, life: .065 }); if (b.trail.length > 10) b.trail.shift(); for (const t of b.trail) t.life -= dt;
    if (b.life <= 0 || b.x < -70 || b.x > A + 70 || b.y < -70 || b.y > A + 70) { bullets.splice(i, 1); continue; }
    let hit = 0; for (const o of obs) { if (cRect(b.x, b.y, b.r, o.x, o.y, o.w, o.h)) { if (!b.pierce) { burst(b.x, b.y, b.col, 5, 100); hit = 1; } break; } }
    if (hit) { bullets.splice(i, 1); continue; }
    if (!b.fp && b.owner !== P && P.alive && P.inv <= 0 && dist(b, P) < P.r + b.r) {
      P.hp -= b.dmg || 9; P.sup = Math.min(P.cost, P.sup + 2.5); burst(b.x, b.y, '#ff4d7a', 10, 140); fDmg(P.x, P.y - 24, Math.round(b.dmg || 9), '#ff6b6b'); cam.sh = 8; sfx.hurt(); bullets.splice(i, 1);
      if (P.hp <= 0) { P.hp = 0; P.alive = 0; burst(P.x, P.y, P.col, 70, 500); flash(.2); end(0); } continue;
    }
    if (b.fp || (b.owner && b.owner !== P)) {
      for (const bot of bots) {
        if (!bot.alive || b.hit.has(bot.id) || bot === b.owner) continue;
        if (dist(b, bot) < bot.r + b.r) {
          if (b.fp) dmgBot(bot, b.dmg, 0);
          else { bot.hp -= b.dmg || 10; burst(b.x, b.y, bot.col, 7, 110); if (bot.hp <= 0) { bot.alive = 0; bot.hp = 0; burst(bot.x, bot.y, bot.col, 28, 280); setTimeout(() => { if (over) return; let x, y; do { x = 160 + Math.random() * (A - 320); y = 160 + Math.random() * (A - 320); } while (Math.hypot(x - P.x, y - P.y) < 350); bot.x = x; bot.y = y; bot.hp = bot.max; bot.alive = 1; bot.target = null; }, 3000); } }
          b.hit.add(bot.id); if (!b.pierce) { bullets.splice(i, 1); break; }
        }
      }
    }
  }

  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i]; p.life -= dt; p.pul += dt * 6; if (p.life <= 0) { powers.splice(i, 1); continue; }
    if (P.alive && dist(P, p) < P.r + 16) {
      if (p.type === 'heal') { P.hp = Math.min(P.max, P.hp + 55); fDmg(P.x, P.y - 40, '+55', '#2ecc71'); }
      else if (p.type === 'super') { P.sup = P.cost; fDmg(P.x, P.y - 40, 'FULL', '#c084fc'); }
      else { P.sup = Math.min(P.cost, P.sup + 75); P.inv = 2.6; fDmg(P.x, P.y - 40, 'RAGE', '#ff4d6d'); }
      burst(p.x, p.y, '#fff', 18, 200); sfx.power(); powers.splice(i, 1);
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= p.dr; p.vy *= p.dr; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }

  const tx = P.x - W / 2, ty = P.y - H / 2;
  cam.x += (tx - cam.x) * Math.min(1, 13 * dt); cam.y += (ty - cam.y) * Math.min(1, 13 * dt);
  if (cam.sh > 0) { cam.x += (Math.random() - .5) * cam.sh; cam.y += (Math.random() - .5) * cam.sh; cam.sh *= .82; if (cam.sh < .1) cam.sh = 0; }

  fx.update(dt);
  // Lock-on for aim assist
  let lock = null, best = .22;
  if (P.alive && inp.aiming) {
    for (const b of bots) {
      if (!b.alive) continue;
      const d = dist(P, b);
      if (d > 520) continue;
      const aT = ang(P, b);
      let da = aT - P.angle; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) < best) { best = Math.abs(da); lock = b; }
    }
  }
  pLk += ((lock ? 1 : 0) - pLk) * Math.min(1, dt * 12);
  P._lock = lock;

  document.getElementById('hp').style.width = (P.hp / P.max * 100) + '%';
  document.getElementById('sp').style.width = (P.sup / P.cost * 100) + '%';
  document.getElementById('kl').textContent = P.kills;
  const m = Math.floor(time / 60), s = Math.floor(time % 60);
  document.getElementById('tm').textContent = `${m}:${s.toString().padStart(2, '0')}`;
  document.getElementById('bdc').textContent = P.dCd > 0 ? P.dCd.toFixed(1) + 's' : '';
}

function dmgBot(bot, dmg, isSuper) {
  bot.hp -= dmg; P.sup = Math.min(P.cost, P.sup + (isSuper ? 3 : 8));
  burst(bot.x, bot.y, bot.col, isSuper ? 22 : 10, isSuper ? 300 : 140);
  fx.hit(bot.x, bot.y, isSuper ? '#c084fc' : P.col);
  fx.num(bot.x, bot.y - 22, '-' + Math.round(dmg), isSuper ? '#c084fc' : '#fff');
  fDmg(bot.x, bot.y - 22, Math.round(dmg), isSuper ? '#c084fc' : '#fff');
  cam.sh = isSuper ? 15 : 5; hitstop = isSuper ? .05 : .015; sfx.hit();
  if (bot.hp <= 0) {
    bot.alive = 0; bot.hp = 0; P.kills++; streak++; streakT = 4.5;
    if (streak >= 2) showStreak(streak);
    burst(bot.x, bot.y, bot.col, 50, 500); fx.boom(bot.x, bot.y, bot.col); sfx.kill(); flash(.09);
    feed(`Eliminated #${bot.id + 1}`);
    msg(streak >= 6 ? 'GODLIKE!' : streak >= 3 ? 'RAMPAGE!' : 'ELIMINATED!', .45);
    hitstop = .07; P.hp = Math.min(P.max, P.hp + 12);
    setTimeout(() => { if (over) return; let x, y; do { x = 160 + Math.random() * (A - 320); y = 160 + Math.random() * (A - 320); } while (Math.hypot(x - P.x, y - P.y) < 400); bot.x = x; bot.y = y; bot.hp = bot.max; bot.alive = 1; bot.target = null; bot.modelId = MODEL_IDS[Math.floor(Math.random() * MODEL_IDS.length)]; bot.col = MODELS[bot.modelId].c.b; }, 2800);
  }
}
function end(won) { over = 1; msg(won ? 'VICTORY<br><small style="font-size:13px">Overcharged</small>' : 'DEFEAT<br><small style="font-size:13px">Try again</small>', 4.5); setTimeout(() => { document.getElementById('menu').classList.remove('hide'); document.getElementById('hud').classList.remove('show'); run = 0; }, 4000); }

function draw() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
  g.addColorStop(0, '#0a0a1e'); g.addColorStop(1, '#03030c'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-cam.x, -cam.y);
  ctx.strokeStyle = 'rgba(0,255,210,.015)'; ctx.lineWidth = 1;
  for (let x = 0; x <= A; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, A); ctx.stroke(); }
  for (let y = 0; y <= A; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(A, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(0,255,210,.35)'; ctx.lineWidth = 6; ctx.shadowColor = 'rgba(0,255,210,.5)'; ctx.shadowBlur = 20; ctx.strokeRect(0, 0, A, A); ctx.shadowBlur = 0;
  for (const o of obs) { ctx.shadowColor = 'rgba(0,170,255,.35)'; ctx.shadowBlur = 14; ctx.fillStyle = '#061018'; rr(ctx, o.x, o.y, o.w, o.h, 10); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(0,210,255,.55)'; ctx.lineWidth = 2; rr(ctx, o.x, o.y, o.w, o.h, 10); ctx.stroke(); }
  for (const p of powers) { const pu = 1 + Math.sin(p.pul) * .15; const cs = { heal: '#2ecc71', super: '#c084fc', rage: '#ff4d6d' }; const c = cs[p.type]; ctx.shadowColor = c; ctx.shadowBlur = 22; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(p.x, p.y, 14 * pu, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.type === 'heal' ? '+' : p.type === 'super' ? '★' : '⚡', p.x, p.y); }
  for (const b of bullets) { for (const t of b.trail) { if (t.life <= 0) continue; ctx.globalAlpha = t.life * 5.5; ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(t.x, t.y, b.r * .4, 0, Math.PI * 2); ctx.fill(); } ctx.globalAlpha = 1; ctx.shadowColor = b.col; ctx.shadowBlur = b.pierce ? 18 : 10; ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (p.life / p.max), 0, Math.PI * 2); ctx.fill(); } ctx.globalAlpha = 1;
  for (const t of P.trail) { ctx.globalAlpha = t.life * 3; ctx.fillStyle = P.col; ctx.beginPath(); ctx.arc(t.x, t.y, P.r * .4, 0, Math.PI * 2); ctx.fill(); } ctx.globalAlpha = 1;
  const tNow = performance.now() / 1000;
  for (const b of bots) if (b.alive) drawC(b.x, b.y, b.r, b.angle, b.col, b.hp / b.max, 0, b.modelId, tNow);
  if (P.alive) {
    if (inp.aiming) {
      drawAim(ctx, { x: P.x, y: P.y, a: P.angle, col: P.col, rng: 480, r: P.r, lk: pLk }, tNow, P._lock || null);
    }
    const fl = P.inv > 0 ? .4 + Math.sin(performance.now() / 18) * .6 : 1;
    ctx.globalAlpha = fl;
    const rx = P.x - Math.cos(P.angle) * pRec * 6, ry = P.y - Math.sin(P.angle) * pRec * 6;
    drawC(rx, ry, P.r * (1 + .05 * pRec), P.angle, P.col, P.hp / P.max, 1, P.modelId, tNow);
    ctx.globalAlpha = 1;
  }
  fx.draw(ctx);
  ctx.restore(); drawMM();
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function drawC(x, y, r, a, col, hpR, isP, modelId, t) {
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x, y + r * .55, r * .95, r * .22, 0, 0, Math.PI * 2); ctx.fill();
  const m = MODELS[modelId];
  if (m) {
    ctx.shadowColor = col; ctx.shadowBlur = isP ? 22 : 12;
    drawModel(ctx, m, x, y, r * 1.15, a, t || 0);
    ctx.shadowBlur = 0;
  } else {
    ctx.shadowColor = col; ctx.shadowBlur = isP ? 26 : 14; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  }
  if (hpR < .99) { const bw = r * 1.6, bh = 4.5; ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - bw / 2, y - r - 14, bw, bh); ctx.fillStyle = hpR > .2 ? '#2ecc71' : '#e74c3c'; ctx.fillRect(x - bw / 2, y - r - 14, bw * hpR, bh); }
}
function drawMM() { const s = 78 / A; mmX.fillStyle = 'rgba(2,3,10,.95)'; mmX.fillRect(0, 0, 78, 78); mmX.fillStyle = 'rgba(0,140,180,.3)'; for (const o of obs) mmX.fillRect(o.x * s, o.y * s, o.w * s, o.h * s); for (const b of bots) { if (!b.alive) continue; mmX.fillStyle = b.col; mmX.beginPath(); mmX.arc(b.x * s, b.y * s, 1.7, 0, Math.PI * 2); mmX.fill(); } mmX.fillStyle = P.col; mmX.shadowColor = P.col; mmX.shadowBlur = 2.5; mmX.beginPath(); mmX.arc(P.x * s, P.y * s, 2.5, 0, Math.PI * 2); mmX.fill(); mmX.shadowBlur = 0; mmX.strokeStyle = 'rgba(0,255,210,.25)'; mmX.lineWidth = 1; mmX.strokeRect(.5, .5, 77, 77); }
function loop(now) { if (!run) return; const dt = Math.min((now - last) / 1000, .03); last = now; update(dt); draw(); requestAnimationFrame(loop); }
</script>
